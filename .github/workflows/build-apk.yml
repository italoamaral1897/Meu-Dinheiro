name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar icone do app
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/ic_launcher.png "$RES/mipmap-$d/ic_launcher.png"
            cp resources/ic_launcher_round.png "$RES/mipmap-$d/ic_launcher_round.png"
            cp resources/ic_launcher_foreground.png "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          sed -i 's/#FFFFFF/#0D5C56/' "$RES/values/ic_launcher_background.xml"

      -       - name: Usar a chave fixa de assinatura
        run: |
          test -f debug.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF

      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MeuDinheiro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
